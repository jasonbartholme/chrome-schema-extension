<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Blue Running Shoes — ShoeShop</title></head>
<body>
<div itemscope itemtype="https://schema.org/Product">
  <h1 itemprop="name">Blue Running Shoes</h1>
  <!-- missing image/description/sku/brand on purpose -->
  <span itemprop="pricecurrency">USD</span>
  <div itemprop="offers" itemscope itemtype="https://schema.org/Offer">
    <span itemprop="price">$89.99</span>
    <meta itemprop="availability" content="InStock">
    <span itemprop="stockLeft">12</span>
  </div>
  <div itemprop="review" itemscope itemtype="https://schema.org/Review">
    <span itemprop="reviewBody">Great shoes!</span>
    <!-- Review missing itemReviewed -->
    <span itemprop="rating">4.5 out of 5 stars</span>
  </div>
  <div itemscope itemtype="https://schema.org/Widget">
    <span itemprop="name">Unknown type demo</span>
  </div>
</div>
</body>
</html>
